<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fundi Scan Wall</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    /* background: #1c1917; */
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* Page background only. #header and #wall both paint their own opaque
     #1c1917 on top, so this is only ever visible in the dead space above
     the wall - it can never sit behind brick text. If wall-bg.jpeg is
     missing, background-image simply fails to paint (no broken-image
     state) and this flat background-color shows instead. */
  #background {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-color: #0d0c0b;
    background-image: url('/images/wall-bg.jpeg');
    background-size: cover;
    background-position: center;
    filter: blur(3px);
    opacity: 0.42;
  }

  #header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 11vh;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 28px;
    background: #1c1917;
    z-index: 10;
  }

  #logo {
    height: 55%;
    width: auto;
    object-fit: contain;
    flex-shrink: 0;
  }

  /* Absolutely positioned within #header (fixed, left:0, right:0) so it
     centres across the full header width rather than the space left over
     between the logo and counter - and never shifts as the counter grows
     from two digits to four, since neither sibling affects its position. */
  #event-title {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    max-width: 50vw;
    font-size: clamp(2.5rem, 2.6vw, 3rem);
    font-weight: 700;
    color: #fdf6ef;
    text-transform: uppercase;
    letter-spacing: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #counter-block {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }

  #counter-label {
    font-size: clamp(14px, 1vw, 20px);
    font-weight: 600;
    color: #9a8f86;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  #counter {
    font-size: clamp(40px, 4.2vw, 90px);
    font-weight: 800;
    color: #fdf6ef;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }

  .status-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #555;
    transition: background 300ms ease-out;
    flex-shrink: 0;
  }

  .status-dot.status-ok { background: #3ddc84; }
  .status-dot.status-down { background: #e5484d; }

  /* Bottom 70% of the viewport. Bricks are sized in vw/vh so both the wall
     and its contents scale together with the display. Padding is the
     mortar frame (bottom full-thickness, sides half, top open since the
     wall is still being built) - it's the same #1c1917 as the joints, and
     wallEl.clientWidth/clientHeight in the script already exclude it, so
     row packing and the conveyor's row-capacity math pack within it for
     free without any extra accounting. */
  #wall {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 70vh;
    display: flex;
    flex-direction: column-reverse;
    gap: 6px 0; /* must match WALL_ROW_GAP_PX in the script */
    overflow: hidden;
    /* background: #1c1917; */
    padding: 0 0.75rem 1.5rem 0.75rem;
  }

  .row {
    height: clamp(48px, 6.2vh, 90px);
    display: flex;
    flex-direction: row;
    gap: 0 4px; /* must match WALL_COL_GAP_PX in the script */
  }

  .brick {
    height: 100%;
    min-width: clamp(90px, 7vw, 160px);
    max-width: clamp(220px, 15vw, 340px);
    width: fit-content;
    flex-shrink: 0;
    flex-grow: 0;
    padding: 0 1.1vw;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 2px;
    box-shadow: 0 0 19px 1px #7d3232 inset;
    color: #fdf6ef;
    opacity: 0;
    transition: opacity 150ms ease-out;
  }

  .brick.brick-visible { opacity: 1; }

  /* min-width: 0 overrides the flex default of min-width: auto, which
     otherwise refuses to let this child shrink below its text's natural
     width - needed so the script can reliably detect "does this text fit"
     via scrollWidth vs clientWidth. No ellipsis: the wall exists to show
     names in full, so overflowing text is handled by the script shrinking
     the font (see FONT_SIZE_FLOOR_PX) rather than truncating. */
  .brick-label {
    min-width: 0;
    max-width: 100%;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
    font-size: clamp(22px, 2.6vh, 32px);
    white-space: nowrap;
  }

  /* Nameless filler bricks close a row flush; they take an explicit inline
     width from the script, so the base clamp must not fight it. Padding
     is zeroed too - with box-sizing: border-box, .brick's ~22px side
     padding would otherwise force a floor on the box width no matter what
     width the script requests, breaking the "start at 0, measure what's
     left, apply that" technique the script relies on to size them. */
  .brick-filler {
    min-width: 0;
    max-width: none;
    padding: 0;
  }

  .arrival-card {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.6);
    opacity: 0;
    border-radius: 4px;
    color: #fdf6ef;
    padding: 56px 84px;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: clamp(48px, 5vw, 96px);
    font-weight: 700;
    transition: transform 300ms ease-out, opacity 300ms ease-out;
    z-index: 100;
    max-width: 80vw;
    /* Layered offset shadows read as a lit top face + shaded side face,
       giving the card real depth so it looks like a solid brick in transit
       rather than a flat card. Colours are set per-instance from the same
       id-derived hue family as its landing brick. */
    box-shadow:
      0 0 19px 1px #7d3232 inset,
      7px 7px 0 0 var(--card-side-color),
      14px 14px 0 0 var(--card-deep-color),
      0 22px 50px rgba(0, 0, 0, 0.45);
  }

  .arrival-card.card-visible {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
</style>
</head>
<body>

<div id="background"></div>
<div id="header">
  <img id="logo" src="/images/logo.png" alt="" onerror="this.style.display='none'">
  <div id="event-title"></div>
  <div id="counter-block">
    <div id="counter-label">Arrived</div>
    <div id="counter">0</div>
    <div id="status-dot" class="status-dot"></div>
  </div>
</div>
<div id="wall"></div>

<script>
(function () {
  'use strict';

  var API_ENDPOINT = '/api/v1/wall/arrivals';
  var POLL_INTERVAL_MS = 2000;
  var QUEUE_TICK_MS = 1000;
  var BACKLOG_THRESHOLD = 10;
  var CARD_HOLD_MS = 1200;
  var CARD_TRAVEL_MS = 450;
  var CONVEYOR_DURATION_MS = 600;

  // Must match the CSS `gap` declarations on .row and #wall.
  var WALL_COL_GAP_PX = 4;
  var WALL_ROW_GAP_PX = 6;
  var MIN_FILLER_WIDTH_PX = 48; // ~3rem
  var FONT_SIZE_FLOOR_PX = 22; // must match the CSS clamp() floor on .brick-label

  var BRICK_FILL_HUE = 0;
  var BRICK_FILL_SATURATION = 43;
  var BRICK_FILL_BASE_LIGHTNESS = 54;
  var BRICK_FILL_LIGHTNESS_SPREAD = 6; // +/- range, deterministic per attendance id
  var FILLER_COLOR_SEED_OFFSET = 1000000; // keeps filler shades out of real-id range

  var accessKey = new URLSearchParams(window.location.search).get('key') || '';
  var eventTitle = new URLSearchParams(window.location.search).get('title') || '';

  var wallEl = document.getElementById('wall');
  var counterEl = document.getElementById('counter');
  var statusDotEl = document.getElementById('status-dot');
  var titleEl = document.getElementById('event-title');
  titleEl.textContent = eventTitle;

  var sinceId = 0;
  var isInitialLoad = true;
  var pollInFlight = false;
  var queue = [];

  var currentRowEl = null;
  var currentRowBricks = [];
  var rowCloseCount = 0;

  var cardAnimating = false;
  var pendingConveyorCheck = false;

  // Deterministic lightness variation keyed on an id, so a reload repaints
  // every brick with the exact same shade as before. lightnessOffset lets
  // the card derive shaded "side"/"deep" faces from the same colour family.
  function brickFillColor(id, lightnessOffset) {
    var idOffset = (id % (BRICK_FILL_LIGHTNESS_SPREAD * 2 + 1)) - BRICK_FILL_LIGHTNESS_SPREAD;
    var lightness = Math.max(0, BRICK_FILL_BASE_LIGHTNESS + idOffset + (lightnessOffset || 0));
    return 'hsl(' + BRICK_FILL_HUE + ', ' + BRICK_FILL_SATURATION + '%, ' + lightness + '%)';
  }

  function createBrickElement(row) {
    var el = document.createElement('div');
    el.className = 'brick';
    el.style.backgroundColor = brickFillColor(row.id);

    var label = document.createElement('span');
    label.className = 'brick-label';
    label.textContent = row.fname + ' ' + row.lname;
    el.appendChild(label);

    return el;
  }

  function createCardElement(row) {
    var el = document.createElement('div');
    el.className = 'arrival-card';
    el.style.backgroundColor = brickFillColor(row.id);
    el.style.setProperty('--card-side-color', brickFillColor(row.id, -14));
    el.style.setProperty('--card-deep-color', brickFillColor(row.id, -28));
    el.textContent = row.fname + ' ' + row.lname;
    return el;
  }

  function measureBrickHeight() {
    var tempRow = document.createElement('div');
    tempRow.className = 'row';
    tempRow.style.visibility = 'hidden';
    tempRow.style.position = 'absolute';
    var sample = createBrickElement({ id: 0, fname: 'X', lname: 'X' });
    tempRow.appendChild(sample);
    wallEl.appendChild(tempRow);
    var height = sample.getBoundingClientRect().height;
    wallEl.removeChild(tempRow);
    return height;
  }

  function revealBrick(brick) {
    requestAnimationFrame(function () {
      brick.classList.add('brick-visible');
    });
  }

  function startNewRow() {
    currentRowEl = document.createElement('div');
    currentRowEl.className = 'row';
    wallEl.appendChild(currentRowEl);
    currentRowBricks = [];
  }

  // Shrinks a name's font in 1px steps toward the floor when it doesn't
  // fit its brick's clamped width. If it still doesn't fit at the floor,
  // the brick is allowed to exceed max-width instead of clipping - a
  // wider brick is acceptable, a cut name is not.
  function fitBrickText(brick, label) {
    var fontSize = parseFloat(getComputedStyle(label).fontSize);
    while (label.scrollWidth > label.clientWidth + 1 && fontSize > FONT_SIZE_FLOOR_PX) {
      fontSize = Math.max(FONT_SIZE_FLOOR_PX, fontSize - 1);
      label.style.fontSize = fontSize + 'px';
    }
    if (label.scrollWidth > label.clientWidth + 1) {
      brick.style.maxWidth = 'none';
    }
  }

  // Inserts a nameless filler at 0 width first, so the gap it introduces
  // against its neighbour is already reflected in the row's rendered
  // width, then measures what's actually left and applies that - exact
  // regardless of how many gap instances are really in play.
  function insertFiller(position) {
    var filler = document.createElement('div');
    filler.className = 'brick brick-filler brick-visible';
    filler.style.width = '0px';
    filler.style.backgroundColor = brickFillColor(FILLER_COLOR_SEED_OFFSET + rowCloseCount);
    if (position === 'start') {
      currentRowEl.insertBefore(filler, currentRowEl.firstChild);
    } else {
      currentRowEl.appendChild(filler);
    }
    return filler;
  }

  // Spreads leftover width too small for a filler across every named
  // brick in the row as extra padding, rather than singling one out.
  function distributeLeftoverAsPadding(leftover) {
    if (currentRowBricks.length === 0) return;
    var perBrick = leftover / currentRowBricks.length;
    currentRowBricks.forEach(function (brick) {
      brick.style.maxWidth = 'none';
      var computed = getComputedStyle(brick);
      var padLeft = parseFloat(computed.paddingLeft);
      var padRight = parseFloat(computed.paddingRight);
      brick.style.paddingLeft = (padLeft + perBrick / 2) + 'px';
      brick.style.paddingRight = (padRight + perBrick / 2) + 'px';
    });
  }

  // How much horizontal space is free between the row's last child (named
  // brick or filler) and the row's own right edge. getBoundingClientRect()
  // reflects true rendered geometry regardless of the row's CSS overflow
  // value, unlike scrollWidth (which only tracks overflow for elements
  // that are actual scroll containers - .row isn't one).
  function remainingRowSpace() {
    var rowRect = currentRowEl.getBoundingClientRect();
    var last = currentRowEl.lastElementChild;
    if (!last) return rowRect.width;
    return Math.max(0, rowRect.right - last.getBoundingClientRect().right);
  }

  // Closes the current row flush against its own real right edge. Which
  // end a single filler lands on strictly alternates every closed row,
  // independent of whether other rows happened to split, so the seam
  // never lines up into a vertical stripe.
  function closeCurrentRow() {
    var leftover = remainingRowSpace();
    var side = (rowCloseCount % 2 === 0) ? 'end' : 'start';

    if (leftover >= MIN_FILLER_WIDTH_PX * 2 + WALL_COL_GAP_PX * 2) {
      var startFiller = insertFiller('start');
      var endFiller = insertFiller('end');
      var remaining = remainingRowSpace();
      startFiller.style.width = (remaining / 2) + 'px';
      endFiller.style.width = (remaining / 2) + 'px';
    } else if (leftover >= MIN_FILLER_WIDTH_PX + WALL_COL_GAP_PX) {
      var filler = insertFiller(side);
      filler.style.width = remainingRowSpace() + 'px';
    } else if (leftover > 0) {
      distributeLeftoverAsPadding(leftover);
    }

    rowCloseCount++;
    currentRowEl = null;
  }

  // Adds a named brick to the wall, packing it into the currently open row
  // or starting a new one if it would overflow. Closed rows are fixed and
  // never reflow. Overflow is checked by comparing the just-placed brick's
  // real right edge against the row's real right edge - true rendered
  // geometry, never an estimate. Returns the brick element (real DOM
  // position, ready for getBoundingClientRect()).
  function addNamedBrickToWall(row) {
    var brick = createBrickElement(row);
    var label = brick.querySelector('.brick-label');
    if (!currentRowEl) startNewRow();

    currentRowEl.appendChild(brick);
    fitBrickText(brick, label);

    var rowRect = currentRowEl.getBoundingClientRect();
    var brickRect = brick.getBoundingClientRect();
    var overflows = currentRowBricks.length > 0 && brickRect.right > rowRect.right + 0.5;

    if (overflows) {
      currentRowEl.removeChild(brick);
      closeCurrentRow();
      startNewRow();
      currentRowEl.appendChild(brick);
      currentRowBricks = [brick];
      checkConveyor();
    } else {
      currentRowBricks.push(brick);
    }

    return brick;
  }

  function placeBrickDirectly(row) {
    revealBrick(addNamedBrickToWall(row));
  }

  function playCardThenBrick(row) {
    cardAnimating = true;

    // Reserve the brick's real slot first (invisible but laid out) so the
    // card can travel to its actual on-screen position, not a guess.
    var brick = addNamedBrickToWall(row);
    var targetRect = brick.getBoundingClientRect();

    var card = createCardElement(row);
    document.body.appendChild(card);
    requestAnimationFrame(function () {
      card.classList.add('card-visible');
    });

    setTimeout(function () {
      var cardRect = card.getBoundingClientRect();
      var dx = (targetRect.left + targetRect.width / 2) - (cardRect.left + cardRect.width / 2);
      var dy = (targetRect.top + targetRect.height / 2) - (cardRect.top + cardRect.height / 2);
      var scale = Math.max(targetRect.width / cardRect.width, 0.1);

      card.style.transition = 'transform ' + CARD_TRAVEL_MS + 'ms ease-in, opacity ' + CARD_TRAVEL_MS + 'ms ease-in';
      card.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(' + scale + ')';
      card.style.opacity = '0';

      setTimeout(function () {
        card.remove();
        revealBrick(brick);
        cardAnimating = false;
        if (pendingConveyorCheck) {
          pendingConveyorCheck = false;
          checkConveyor();
        }
      }, CARD_TRAVEL_MS);
    }, CARD_HOLD_MS);
  }

  function processQueueTick() {
    if (queue.length === 0) return;

    if (queue.length > BACKLOG_THRESHOLD) {
      // Burst backlog: skip the card stage entirely until it drains back
      // under the threshold, so the wall never falls behind the door.
      while (queue.length > BACKLOG_THRESHOLD) {
        placeBrickDirectly(queue.shift());
      }
      return;
    }

    playCardThenBrick(queue.shift());
  }

  // How many rows fit the wall's fixed height at the current viewport size.
  function wallRowCapacity() {
    var brickHeightPx = measureBrickHeight();
    return Math.max(1, Math.floor((wallEl.clientHeight + WALL_ROW_GAP_PX) / (brickHeightPx + WALL_ROW_GAP_PX)));
  }

  // Triggered once per row close. Skips (and remembers) while a card is
  // mid-animation, since sliding rows out from under a travelling card
  // would move its just-measured target slot.
  function checkConveyor() {
    if (cardAnimating) {
      pendingConveyorCheck = true;
      return;
    }
    if (wallEl.children.length > wallRowCapacity()) {
      conveyorStep();
    }
  }

  // Removes the two oldest (bottom) rows, animating them down out of frame
  // while the remaining rows settle down (FLIP) into the vacated space.
  function conveyorStep() {
    var rows = Array.prototype.slice.call(wallEl.children);
    if (currentRowEl && rows[rows.length - 1] === currentRowEl) {
      rows = rows.slice(0, -1);
    }
    if (rows.length < 2) return;

    var toRemove = rows.slice(0, 2);
    var toKeep = rows.slice(2);
    var oldRects = toKeep.map(function (r) { return r.getBoundingClientRect(); });
    var removeRects = toRemove.map(function (r) { return r.getBoundingClientRect(); });

    toRemove.forEach(function (row, i) {
      var rect = removeRects[i];
      row.style.position = 'fixed';
      row.style.left = rect.left + 'px';
      row.style.top = rect.top + 'px';
      row.style.width = rect.width + 'px';
      row.style.height = rect.height + 'px';
      row.style.margin = '0';
      row.style.zIndex = '5';
      document.body.appendChild(row);
    });

    var newRects = toKeep.map(function (r) { return r.getBoundingClientRect(); });

    toKeep.forEach(function (row, i) {
      var dy = oldRects[i].top - newRects[i].top;
      if (dy) {
        row.style.transition = 'none';
        row.style.transform = 'translateY(' + dy + 'px)';
      }
    });

    void wallEl.offsetHeight; // force reflow before enabling the settle transition

    toKeep.forEach(function (row) {
      row.style.transition = 'transform ' + CONVEYOR_DURATION_MS + 'ms ease-out';
      row.style.transform = '';
    });

    requestAnimationFrame(function () {
      toRemove.forEach(function (row) {
        row.style.transition = 'transform ' + CONVEYOR_DURATION_MS + 'ms ease-in, opacity ' + CONVEYOR_DURATION_MS + 'ms ease-in';
        row.style.transform = 'translateY(30vh)';
        row.style.opacity = '0';
      });
    });

    setTimeout(function () {
      toRemove.forEach(function (row) { row.remove(); });
    }, CONVEYOR_DURATION_MS + 60);
  }

  function setConnected(isConnected) {
    statusDotEl.classList.toggle('status-ok', isConnected);
    statusDotEl.classList.toggle('status-down', !isConnected);
  }

  function handleArrivals(arrivals, total) {
    counterEl.textContent = total.toLocaleString();

    if (!arrivals || arrivals.length === 0) return;

    for (var i = 0; i < arrivals.length; i++) {
      if (arrivals[i].id > sinceId) sinceId = arrivals[i].id;
    }

    if (isInitialLoad) {
      // Repaint the existing wall immediately rather than replaying it as
      // a minutes-long sequence of arrival cards.
      arrivals.forEach(placeBrickDirectly);
      isInitialLoad = false;
      return;
    }

    queue = queue.concat(arrivals);
  }

  function poll() {
    if (pollInFlight) return;
    pollInFlight = true;

    var url = API_ENDPOINT + '?since_id=' + sinceId + '&key=' + encodeURIComponent(accessKey);

    fetch(url, { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (body) {
        if (!body.success) throw new Error(body.message || 'poll failed');
        handleArrivals(body.data.arrivals, body.data.total);
        setConnected(true);
      })
      .catch(function () {
        // Failed poll: keep last known state on screen, never reset
        // sinceId (that would replay arrivals and duplicate bricks),
        // just flag it via the indicator and retry next tick.
        setConnected(false);
      })
      .finally(function () {
        pollInFlight = false;
      });
  }

  poll();
  setInterval(poll, POLL_INTERVAL_MS);
  setInterval(processQueueTick, QUEUE_TICK_MS);
})();
</script>

</body>
</html>
